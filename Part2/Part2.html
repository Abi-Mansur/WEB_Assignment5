    <div class="container">
        <h1>Task 2 </h1>


        <p id="task">click the button below to change this text</p>

        <div style="text-align: center; padding: 20px;">
        <button class="button" onclick="changeText()">Change text</button>
        </div>


        <h1>Task 3 </h1>

        
        <div>
            <p id = "task3">click the button below to change the font size and background color</p>
            <div style="text-align: center; padding: 20px;">
                
                <button class="button" onclick="changebackground()">Change background color</button>
                <button class="button" onclick="changeFontSize()">Change font size</button>
            </div>
        </div>    
        




    </div>






    <script>
        function changeText() {
            document.getElementById("task").innerHTML = "New text!";

        }
    </script>

    <script>
        function changebackground() {
            document.getElementById("task3").style.backgroundColor = "green";
        }
        function changeFontSize() {
            document.getElementById("task3").style.fontSize = "30px";
        }
    </script>
