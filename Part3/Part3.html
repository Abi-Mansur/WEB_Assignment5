        <p class="task" id="box" onmouseover="mouseOver()" onmouseout="mouseOut()">box</p>

        <h1>Task 6 </h1>

        <div class="task">
            Enter your name: <br>
            <input class="lol" type="text" id="fname" onkeyup="task6()">

            <p> My name is: <br> <span id="print"></span></p>

        function mouseOver() {

    <script>

            let x = document.getElementById("fname").value;
            document.getElementById("print").innerHTML = x;

        }
