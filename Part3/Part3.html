<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 5</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <div class="logo">Assignment 5</div>
        <ul>
            <li><a href="../index.html">Part 1</a></li>
            <li><a href="../Part2/Part2.html">Part 2</a></li>
            <li><a href="Part3.html">Part 3</a></li>
            <li><a href="../Part4/Part4.html">Part 4</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1>Task 5 </h1>

        <p class="task" id="box" onmouseover="mouseOver()" onmouseout="mouseOut()">box</p>

        <h1>Task 6 </h1>

        <div class="task">
            Enter your name: <br>
            <input class="lol" type="text" id="fname" onkeyup="task6()">

            <p> My name is: <br> <span id="print"></span></p>

        </div>


        <h1>Task 7 </h1>

        <div class="task">
            <input class="lol" type="number" id="num1" placeholder="Enter first number">
            <br>
            <input class="lol" type="number" id="num2" placeholder="Enter second number">

            <br>

            <button onclick="calculate('+')">+</button>
            <button onclick="calculate('-')">-</button>
            <button onclick="calculate('*')">*</button>
            <button onclick="calculate('/')">/</button>

            <h3>Result: <span id="result">0</span></h3>
        </div>




    </div>



    <script>
        function mouseOver() {
            document.getElementById("box").style.backgroundColor = "green";
        }    
        function mouseOut() {
            document.getElementById("box").style.backgroundColor = "#202a44";
        }
    </script>


    <script>
        function task6(){

            let x = document.getElementById("fname").value;
            document.getElementById("print").innerHTML = x;

        }
    </script>

    <script>
        function calculate(operator) {
            let a = Number(document.getElementById("num1").value);
            let b = Number(document.getElementById("num2").value);
            let result;

            if (operator === '+') {
                result = a + b;
            } else if (operator === '-') {
                result = a - b;
            } else if (operator === '*') {
                result = a * b;
            } else if (operator === '/') {
                if (b === 0) {
                    document.getElementById("result").textContent =
                        "Cannot divide by zero";
                    return;
                }
                result = a / b;
            }

            document.getElementById("result").textContent = result;
        }
    </script>



</body>
</html>
